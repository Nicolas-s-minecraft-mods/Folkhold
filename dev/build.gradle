// Development runtime. It has no code and is not published.
// It loads all Folkhold mods in one game instance: client, dedicated server and GameTest server.
//
//   ./gradlew :dev:runServer                     dedicated server (port 25565)
//   ./gradlew :dev:runServer -PdebugPort=5005    same, with a Java debugger on port 5005
//   ./gradlew :dev:runGameTestServer             runs all GameTests in a new world (folder run-gametest), then stops
//   ./gradlew :dev:runGameTestServer -PgametestShard=2/4   runs the GameTests of the shard 2 of 4
//   ./gradlew :dev:runClient                     client (needs a display, not available in the container)

plugins {
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/repositories.gradle')

def modProjects = [':core', ':blocks', ':world', ':balance', ':events']
modProjects.each { evaluationDependsOn(it) }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    modProjects.each { path ->
        implementation project(path)
        // The GameTests of the mod, on the classpath of the runs.
        implementation rootProject.project(path).sourceSets.gametest.output
    }
}

def gameTestNamespaces = modProjects.collect { project(it).property('mod_id') }.join(',')
def debugPort = providers.gradleProperty('debugPort').getOrNull()
// The shard of the GameTests, for example -PgametestShard=2/4 (see GameTestShards in the GameTests of core). With no
// value, the GameTest server runs all the tests.
def gametestShard = providers.gradleProperty('gametestShard').getOrNull()

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            // The names of all the tests and of the tests of the shard, for the check of the shards of the CI.
            systemProperty 'folkhold.gametest.shardReport', project.file('run-gametest/shard-report').absolutePath
            if (gametestShard != null) {
                systemProperty 'folkhold.gametest.shard', gametestShard
            }
        }

        configureEach {
            // The GameTest server has its own folder: it does not open the world of the client and the server.
            gameDirectory = project.file(name == 'gameTestServer' ? 'run-gametest' : 'run')
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
            // The CI reads the logs through tee: INFO keeps them short. A developer gets DEBUG and the registry
            // markers.
            if (System.getenv('CI') != null) {
                logLevel = org.slf4j.event.Level.INFO
            } else {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
            if (debugPort != null) {
                // Listen on all interfaces, so that an IDE outside the container can attach.
                jvmArgument "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:${debugPort}"
            }
        }
    }
}

// Link each mod id to the source sets of its project: the mod and its GameTests.
modProjects.each { path ->
    def modProject = project(path)
    neoForge.mods.create(modProject.property('mod_id') as String) {
        sourceSet(modProject.sourceSets.main)
        sourceSet(modProject.sourceSets.gametest)
    }
}

// The dev project has no code. Do not make an empty jar.
tasks.named('jar') {
    enabled = false
}

// Each GameTest run starts in a new world with the default configuration: the tests do not see the saved data or
// the configuration files of an earlier run.
//
// The GameTests set the options in memory. A reload of an options file sets the values of the file again, at a random
// time. Thus the GameTest server does not watch the options files (disableConfigWatcher in config/fml.toml).
def gameTestWorld = project.file('run-gametest/world')
def gameTestConfig = project.file('run-gametest/config')
def gameTestReport = project.file('run-gametest/shard-report')
tasks.named('runGameTestServer') {
    doFirst {
        gameTestWorld.deleteDir()
        gameTestConfig.deleteDir()
        gameTestReport.deleteDir()
        gameTestConfig.mkdirs()
        new File(gameTestConfig, 'fml.toml').text = 'disableConfigWatcher = true\n'
    }
}
