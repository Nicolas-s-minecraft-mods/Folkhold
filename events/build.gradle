plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

// The mods block below uses the source set of the core project.
evaluationDependsOn(':core')

apply from: rootProject.file('gradle/mod-common.gradle')
apply from: rootProject.file('gradle/confee.gradle')

dependencies {
    api project(':core')
    // The tests of the client config load Confee with no game runtime. Confee logs with SLF4J (the version of
    // Minecraft 1.21.1).
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'
}

neoForge {
    mods {
        folkhold_core {
            sourceSet(project(':core').sourceSets.main)
        }
    }
}
